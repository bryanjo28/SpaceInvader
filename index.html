<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Money Catcher</title>
	<script src="leap-1.1.1.min.js"></script>
	<link rel="stylesheet" href="styles.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
	<div id="gameOverDialog" class="dialog" style="display: none;">
        <img src="gameover2.gif" alt="Game Over">
        <p>Score: <span id="scoreDisplay" style="font-weight: bold;">0</span></p>
        <button onclick="restartGame()">Restart</button>
    </div>

	<div id="scoreContainer">
		<span>Score:</span><span id="score">0</span>
	</div>
	<div id="lives">
		<span id="life1" class="life-icon"><i class="fas fa-heart"></i></span>
		<span id="life2" class="life-icon"><i class="fas fa-heart"></i></span>
		<span id="life3" class="life-icon"><i class="fas fa-heart"></i></span>
		<img src="awan.gif" class="cloud-icon" alt="Cloud">
	</div>
	<canvas id="gameCanvas"></canvas>
	<script src="script_motion.js"></script>
	<script src="leap-1.1.1.js"></script>
</body>

</html>
